name: Development Stack Compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dev-compatibility
  cancel-in-progress: false

jobs:
  dev-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential clang cmake jq lsof protobuf-compiler sqlite3 libudev-dev
      - name: Resolve and build latest development stack
        run: scripts/fetch-dev-stack.sh .bench-cache/dev tools
      - name: Verify frozen source and artifact provenance
        run: cargo run -- verify-build-manifest --config examples/harness-dev.toml
      - name: Test resolved harness
        run: cargo test --all-features
      - name: Upload frozen development manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-build-manifest
          path: tools/build-manifest.json
      - name: Refresh documentation snapshot
        if: success()
        run: scripts/update-dev-stack-docs.sh tools/build-manifest.json README.md Cargo.lock .bench-cache/dev/tari
      - name: Create documentation refresh pull request
        if: success()
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: README.md
          branch: docs/dev-stack-snapshot
          delete-branch: true
          commit-message: Refresh development stack snapshot
          title: Refresh development stack snapshot
          body: |
            Automated refresh of the README development stack snapshot from a
            fully verified development stack resolution (build, provenance, and
            tests all passed). Prose outside the snapshot markers is unchanged.
