name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential clang cmake lsof protobuf-compiler sqlite3
      - name: Install ast-grep
        run: npm install --global @ast-grep/cli
      - name: Verify pinned source provenance
        run: |
          scripts/fetch-minotari-cli.sh --verify-only .bench-cache tools
          scripts/fetch-payment-processor.sh --verify-only .bench-cache tools
      - name: Format
        run: cargo fmt --check
      - name: Check
        run: cargo check --all-features
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test default features
        run: cargo test
      - name: Test all features
        run: cargo test --all-features
      - name: ast-grep
        run: ast-grep scan
      - name: Generated schema is current
        run: cargo run -- schema --out RESULT_PROFILE_SCHEMA.json && git diff --exit-code -- RESULT_PROFILE_SCHEMA.json
      - name: Reproduce committed baseline correction
        run: |
          scripts/correct-profile.py \
            --raw baselines/esmeralda_baseline.raw.json \
            --manifest baselines/esmeralda_baseline.correction.json \
            --out /tmp/esmeralda_baseline.corrected.json
          cmp baselines/esmeralda_baseline.json /tmp/esmeralda_baseline.corrected.json
      - name: Validate committed baseline
        run: cargo run -- validate-profile --profile baselines/esmeralda_baseline.json --submission
      - name: Verify committed summary
        run: |
          cargo run -- summarize-profile --profile baselines/esmeralda_baseline.json --out /tmp/esmeralda_baseline.summary.md
          cmp baselines/esmeralda_baseline.summary.md /tmp/esmeralda_baseline.summary.md
      - name: Reject tracked secret artifacts
        run: test -z "$(git ls-files '*.env' '*.db' '*.sqlite' '.secrets/**')"
      - name: Diff hygiene
        run: git diff --check
